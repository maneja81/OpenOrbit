<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="41%" r="75%">
      <stop offset="0%" stop-color="#00152b"/>
      <stop offset="100%" stop-color="#00060f"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#00060f"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d8fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#002a52"/>
      <stop offset="100%" stop-color="#00060f"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- orbit rings, concentric, drawn as true circles at three radii -->
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="96"  stroke="rgba(90,170,255,0.32)" stroke-width="1.4"/>
    <circle cx="256" cy="256" r="150" stroke="rgba(90,170,255,0.24)" stroke-width="1.4"/>
    <circle cx="256" cy="256" r="204" stroke="rgba(90,170,255,0.16)" stroke-width="1.4"/>
  </g>

  <!-- central orchestrator glow + core, matches #orchestrator: radial(#003366→#00060f), border #3d8fff -->
  <circle cx="256" cy="256" r="84" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="46" fill="url(#core)"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#3d8fff" stroke-width="3"/>

  <!-- four orbiting agent nodes, matches .agent-node-circle: radial(#002a52→#00060f), border purple -->
  <!-- ring r=96, angle 200deg -->
  <circle cx="165.8" cy="288.8" r="13" fill="url(#node)" stroke="rgba(167,139,250,0.85)" stroke-width="2"/>
  <!-- ring r=150, angle -20deg -->
  <circle cx="396.9" cy="204.7" r="16" fill="url(#node)" stroke="rgba(167,139,250,0.85)" stroke-width="2"/>
  <!-- ring r=150, angle 100deg -->
  <circle cx="230.0" cy="403.7" r="11" fill="url(#node)" stroke="rgba(167,139,250,0.85)" stroke-width="2"/>
  <!-- ring r=204, angle 55deg -->
  <circle cx="373.0" cy="88.9" r="14" fill="url(#node)" stroke="rgba(167,139,250,0.85)" stroke-width="2"/>
</svg>
